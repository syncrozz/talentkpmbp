<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="220" r="90" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="256" cy="280" r="70" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Graduation Cap Icon & Creative Wings -->
  <!-- Cap Top Diamond -->
  <polygon points="256,120 390,185 256,250 122,185" fill="url(#blueGrad)" filter="url(#glow)"/>
  <polygon points="256,135 370,190 256,240 142,190" fill="#1e3a8a" opacity="0.7"/>

  <!-- Cap Skull Base -->
  <path d="M165,210 L165,275 C165,320 347,320 347,275 L347,210 L256,250 Z" fill="url(#blueGrad)"/>

  <!-- Tassel & Gold Star -->
  <path d="M142,190 Q120,240 126,290" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="126" cy="295" r="9" fill="url(#goldGrad)"/>

  <!-- Center Crest: Talent Starburst / Sparkle -->
  <g transform="translate(256, 360)">
    <!-- Starburst -->
    <path d="M0,-35 Q0,-8 28,0 Q0,8 0,35 Q0,8 -28,0 Q0,-8 0,-35 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#fff"/>
  </g>

  <!-- Subtle SES 4.4 Badge -->
  <rect x="186" y="425" width="140" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="256" y="442" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">KPMBP • SES 4.4</text>
</svg>
