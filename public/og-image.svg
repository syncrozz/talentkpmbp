<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="blueGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="90%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradients for UI Elements -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#blueGlow)"/>
  <rect width="1200" height="630" fill="url(#goldGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>

  <!-- Subtle Geometric Grid / Dots -->
  <pattern id="dotPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.4"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>

  <!-- LEFT SIDE: Platform Branding & Highlights -->
  <g transform="translate(80, 80)">
    <!-- College & Platform Tag -->
    <rect x="0" y="0" width="370" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="18" cy="18" r="5" fill="#60a5fa"/>
    <text x="32" y="23" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">KOLEJ PROFESIONAL MARA BANDAR PENAWAR</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      KPMBP Student Talent
    </text>
    <text x="0" y="145" fill="url(#blueText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
      &amp; Opportunity Platform
    </text>

    <!-- Core Philosophy Subtitle -->
    <text x="0" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      "One Student. Many Opportunities. Simple for Students. Powerful for Admin."
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="52" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="16" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SES 4.4 CORE</text>
      <text x="16" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Data Normalization</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="165" height="52" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="196" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SLUG URL ENTRY</text>
      <text x="196" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Direct Open Calls</text>

      <!-- Badge 3 -->
      <rect x="360" y="0" width="165" height="52" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="376" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TALENT SOURCING</text>
      <text x="376" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Search &amp; Direct Invite</text>
    </g>

    <!-- Bottom Compliance Line -->
    <g transform="translate(0, 420)">
      <circle cx="10" cy="10" r="4" fill="#3b82f6"/>
      <text x="24" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Platform Pengurusan &amp; Pencarian Bakat Kolej Profesional MARA Bandar Penawar</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Visual Preview Floating Cards -->
  <g transform="translate(710, 70)" filter="url(#shadow)">
    <!-- Primary Mock Card: Opportunity (Legacy Band) -->
    <rect x="0" y="0" width="410" height="230" rx="20" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.8"/>
    
    <!-- Card Top Header -->
    <rect x="24" y="24" width="76" height="24" rx="12" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1"/>
    <text x="62" y="40" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
    
    <text x="110" y="40" fill="#64748b" font-family="monospace" font-size="12">/legacy-band-2026</text>

    <text x="24" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      Legacy Band 2026 Audition
    </text>
    <text x="24" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Panggilan terbuka rasmi pemuzik &amp; vokalis kolej
    </text>

    <!-- Role Tags -->
    <g transform="translate(24, 132)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="30" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Guitar</text>
      
      <rect x="68" y="0" width="54" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="95" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Bass</text>

      <rect x="130" y="0" width="58" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="159" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Vocal</text>

      <rect x="196" y="0" width="60" height="24" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="226" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Drums</text>
    </g>

    <!-- Quick apply button mock -->
    <rect x="24" y="174" width="362" height="36" rx="10" fill="#2563eb"/>
    <text x="205" y="197" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Mohon Sekarang (Auto ID Normalizer)</text>

    <!-- Secondary Overlapping Card: Student Talent Card -->
    <g transform="translate(40, 246)">
      <rect x="0" y="0" width="370" height="190" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
      
      <circle cx="44" cy="44" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="44" y="50" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">AB</text>

      <text x="80" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">AINA BATRISYIA</text>
      <text x="80" y="56" fill="#60a5fa" font-family="monospace" font-size="12">PDA-2502-011 • DIA Sem 4</text>

      <line x1="20" y1="80" x2="350" y2="80" stroke="#1e293b" stroke-width="1"/>

      <!-- Skills -->
      <text x="20" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Kemahiran:</text>
      <rect x="88" y="90" width="92" height="22" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="134" y="105" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Lead Guitar</text>
      
      <rect x="188" y="90" width="80" height="22" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="228" y="105" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Acoustic</text>

      <!-- Status Pill -->
      <rect x="20" y="132" width="330" height="34" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
      <text x="185" y="153" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✓ Status: SHORTLISTED (Legacy Band 2026)</text>
    </g>
  </g>
</svg>
